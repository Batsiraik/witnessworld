<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WWC API Status</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --warn: #f0c14b;
      --line: #2a3542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1c3a4d 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.25rem 3rem;
    }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .bar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
      margin-bottom: 1.25rem;
    }
    button {
      background: #2f6fed; color: #fff; border: 0; border-radius: 10px;
      padding: 0.65rem 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.85rem;
      background: var(--card); border: 1px solid var(--line);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--bad); }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.75rem;
    }
    .row {
      display: flex; justify-content: space-between; gap: 1rem; align-items: baseline;
      flex-wrap: wrap;
    }
    .name { font-weight: 600; }
    .meta { color: var(--muted); font-size: 0.85rem; word-break: break-all; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    pre {
      margin: 0.75rem 0 0; padding: 0.75rem; border-radius: 10px;
      background: #0b1015; color: #c7d2de; font-size: 0.78rem;
      overflow: auto; max-height: 220px; display: none;
    }
    .card.open pre { display: block; }
    a { color: #8ec5ff; }
  </style>
</head>
<body>
  <main>
    <h1>Witness World — API status</h1>
    <p class="sub">
      Checks this server’s health and a few public API routes.
      Open from the same host you’re testing
      (e.g. <a href="/status.html">/status.html</a>).
    </p>
    <div class="bar">
      <button id="runBtn" type="button">Run checks</button>
      <span class="pill"><span class="dot" id="overallDot"></span><span id="overallText">Not run yet</span></span>
      <span class="pill" id="originPill"></span>
    </div>
    <div id="results"></div>
  </main>
  <script>
    const ENDPOINTS = [
      { name: 'Health', path: 'health.php', method: 'GET' },
      { name: 'Discover feed', path: 'discover-feed.php', method: 'GET' },
      { name: 'Marketplace stores', path: 'marketplace-stores.php', method: 'GET' },
      { name: 'Directory list', path: 'directory-list.php', method: 'GET' },
      { name: 'Login endpoint (expects 405/422 without body)', path: 'login.php', method: 'GET' },
    ];

    const host = location.hostname.toLowerCase();
    const isLocal =
      host === 'localhost' || host === '127.0.0.1' ||
      /^192\.168\.\d+\.\d+$/.test(host) || /^10\.\d+\.\d+\.\d+$/.test(host);
    const isProd =
      host === 'witnessworldconnect.com' || host === 'www.witnessworldconnect.com';
    const API_BASE = isProd
      ? 'https://witnessworldconnect.com/api'
      : isLocal
        ? `${location.origin}/witnessworld/api`
        : `${location.origin}/api`;

    document.getElementById('originPill').textContent = API_BASE;

    async function checkOne(ep) {
      const url = `${API_BASE}/${ep.path}`;
      const t0 = performance.now();
      try {
        const res = await fetch(url, {
          method: ep.method,
          headers: { Accept: 'application/json' },
          cache: 'no-store',
        });
        const ms = Math.round(performance.now() - t0);
        const text = await res.text();
        let body = text;
        try { body = JSON.stringify(JSON.parse(text), null, 2); } catch {}
        // login GET often 405 — still means PHP/API is reachable
        const reachable = res.status > 0;
        const ok = reachable && res.status < 500;
        return { ...ep, url, ok, status: res.status, ms, body };
      } catch (e) {
        return {
          ...ep,
          url,
          ok: false,
          status: 0,
          ms: Math.round(performance.now() - t0),
          body: String(e && e.message ? e.message : e),
        };
      }
    }

    function render(results) {
      const box = document.getElementById('results');
      box.innerHTML = '';
      const allOk = results.every((r) => r.ok);
      document.getElementById('overallDot').className = 'dot ' + (allOk ? 'ok' : 'bad');
      document.getElementById('overallText').textContent = allOk
        ? `All ${results.length} checks OK`
        : 'One or more checks failed';

      for (const r of results) {
        const el = document.createElement('article');
        el.className = 'card';
        el.innerHTML = `
          <div class="row">
            <div>
              <div class="name">${r.name}</div>
              <div class="meta">${r.url}</div>
            </div>
            <div class="status ${r.ok ? 'ok' : 'bad'}">${r.ok ? 'OK' : 'FAIL'} · HTTP ${r.status || '—'} · ${r.ms}ms</div>
          </div>
          <pre></pre>`;
        el.querySelector('pre').textContent = r.body.slice(0, 4000);
        el.addEventListener('click', () => el.classList.toggle('open'));
        box.appendChild(el);
      }
    }

    async function run() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = 'Running…';
      document.getElementById('overallText').textContent = 'Checking…';
      const results = [];
      for (const ep of ENDPOINTS) results.push(await checkOne(ep));
      render(results);
      btn.disabled = false;
      btn.textContent = 'Run checks';
    }

    document.getElementById('runBtn').addEventListener('click', run);
    run();
  </script>
</body>
</html>
